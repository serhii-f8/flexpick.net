# Ploi Webserver Configuration, do not remove!
include /etc/nginx/ploi/audit.flexpick.net/before/*;

server {
    listen 80;
    listen [::]:80;

    root /home/ploi/audit.flexpick.net/backend/public;
    server_name audit.flexpick.net;

    include /etc/nginx/ssl/audit.flexpick.net;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_dhparam /etc/nginx/dhparams.pem;

    index index.php index.html;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    charset utf-8;

    # Ploi Configuration, do not remove!
    include /etc/nginx/ploi/audit.flexpick.net/server/*;

    # Astro's hashed build assets — safe to cache forever.
    location ^~ /_astro/ {
        root /home/ploi/audit.flexpick.net/frontend/dist;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Try the Astro landing site first, then fall through to Laravel.
    # NOTE: root is set here (not just @laravel) deliberately — if this
    # location inherited the server-level backend/public root, `$uri/` on
    # the request "/" would resolve trivially (backend/public/ always
    # exists as a directory) and nginx would serve backend/public/index.php
    # via the `index` directive before @laravel is ever tried, silently
    # shadowing the Astro landing page at the root path only.
    location / {
        root /home/ploi/audit.flexpick.net/frontend/dist;
        try_files $uri $uri/ @laravel;
    }

    location @laravel {
        root /home/ploi/audit.flexpick.net/backend/public;
        try_files $uri /index.php?$query_string;
    }

    access_log off;
    error_log  /var/log/nginx/audit.flexpick.net-error.log error;

    location = /favicon.ico { access_log off; log_not_found off; }

    location = /robots.txt {
        root /home/ploi/audit.flexpick.net/frontend/dist;
        try_files $uri @laravel;
        access_log off;
        log_not_found off;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        try_files $uri /index.php =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_buffers 32 32k;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# Ploi Webserver Configuration, do not remove!
include /etc/nginx/ploi/audit.flexpick.net/after/*;
