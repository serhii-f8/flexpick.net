name: Deploy staging

on:
  push:
    branches: [main]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      # Dev dependencies are required here: deployer/deployer lives in
      # require-dev, so --no-dev would leave vendor/bin/dep absent. This
      # install is the runner's orchestration tool only -- the release
      # installs its own production vendors on the server.
      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Load the deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: php vendor/bin/dep deploy staging --no-interaction
