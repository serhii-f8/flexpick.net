include:
    - path: backend/compose.yml

services:
    frontend:
        image: node:22-alpine
        user: '${WWWUSER:-1000}:${WWWGROUP:-1000}'
        working_dir: /app
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
        environment:
            PUBLIC_APP_URL: 'http://localhost:8080'
        volumes:
            - ./frontend:/app
        ports:
            - '4321:4321'
        restart: unless-stopped
